services:
  # Sidecar that gives the dashboard its own tailnet identity + HTTPS, so it
  # never needs a port published on the QNAP's LAN. `app` shares this
  # container's network namespace (network_mode: service:tailscale), so
  # tailscale/serve-config.json can proxy the tailnet's :443 straight to
  # 127.0.0.1:4173.
  tailscale:
    image: tailscale/tailscale:latest
    hostname: ffl-dashboard
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve-config.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale/serve-config.json:/config/serve-config.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped

  app:
    build: .
    network_mode: service:tailscale
    env_file:
      - .env
    volumes:
      # Intel/LLM-digest cache (.cache/) — without this, every restart or
      # rebuild throws it away and the next page load re-runs the LLM digest
      # for every player from scratch. Persisting it keeps that a one-time cost.
      - app-cache:/app/.cache
    depends_on:
      - tailscale
    restart: unless-stopped

volumes:
  tailscale-state:
  app-cache:
